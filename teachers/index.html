<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Prompt Generator für Lehrkräfte</title>
<meta name="description" content="Baue dir in wenigen Schritten Prompts, mit denen eine KI Sprech-Hausaufgaben deiner Klasse auswertet – mit Feedback, Übungen und Unterrichtsvorschlägen.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--p:#a5c500;--d:#003468;--w:#fef3c7;--wb:#fcd34d;--wt:#92400e;--ib:#eff6ff;--ibb:#bfdbfe;--it:#1e40af;--selbg:#f0f8d8;--selbg-hover:#f6faeb;--ok:#15803d;--err:#b91c1c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f8fafc;font-family:'Segoe UI',Arial,sans-serif;color:#1e293b;}
.gh{background:var(--d);}
.hi{max-width:780px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:16px;}
.ht{flex:1;}.ht h1{font-size:28px;font-weight:800;color:white;margin-bottom:3px;letter-spacing:-.01em;}
.him{width:72px;height:72px;object-fit:cover;border-radius:50%;flex-shrink:0;border:3px solid rgba(165,197,0,.6);}
.hs{background:linear-gradient(135deg,var(--d) 0%,#005a8e 100%);padding:9px 24px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--p);}
.hs span{color:rgba(255,255,255,.85);font-size:13px;font-style:italic;text-align:center;}
.ww{max-width:780px;margin:0 auto;padding:26px 20px 50px;}
.pp{display:flex;gap:3px;margin-bottom:4px;}
.pip{height:4px;flex:1;border-radius:2px;background:#e2e8f0;transition:background .3s;}
.pip.done{background:var(--p);}.pip.active{background:var(--d);}
.pi{display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-bottom:18px;}
.sc{background:white;border-radius:20px;box-shadow:0 4px 24px rgba(0,52,104,.1);border:2px solid #e2e8f0;padding:26px 26px 22px;}
.ey{font-size:11px;font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.st{font-size:19px;font-weight:800;color:var(--d);margin-bottom:5px;}
.sh{font-size:13px;color:#64748b;line-height:1.55;margin-bottom:20px;}
.blk{margin-bottom:22px;}
.blk:last-child{margin-bottom:0;}
.fine-section + .fine-section{border-top:1px solid #e2e8f0;margin-top:20px;padding-top:20px;}
.fine-title{font-size:15px;font-weight:700;color:var(--d);margin-bottom:12px;}
.bl{display:block;font-size:13.5px;font-weight:700;color:var(--d);margin-bottom:4px;}
.bh{display:block;font-size:12px;color:#64748b;margin-bottom:8px;line-height:1.45;}
.rq{color:#ef4444;}
input.ti,textarea.ti{width:100%;border:2px solid #e2e8f0;border-radius:10px;padding:10px 13px;font-size:14px;color:#1e293b;background:#f8fafc;font-family:inherit;transition:border-color .18s;}
input.ti:focus,textarea.ti:focus{outline:none;border-color:var(--p);background:white;box-shadow:0 0 0 3px rgba(165,197,0,.15);}
textarea.ti{resize:vertical;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:8px 16px;border-radius:20px;border:2px solid #e2e8f0;font-size:13.5px;cursor:pointer;background:#f8fafc;color:#334155;transition:all .15s;user-select:none;font-family:inherit;}
.chip:hover{border-color:var(--p);background:var(--selbg);}
.chip.sel{background:var(--p);border-color:var(--p);color:var(--d);font-weight:700;}
.sfr{margin:0 0 10px;}
.sfr summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--d);margin-bottom:8px;}
.sfn{font-size:12px;font-weight:700;color:#64748b;margin:4px 0 6px;}
.sww{font-size:12.5px;color:#92400e;background:#fef3c7;border-radius:8px;padding:6px 10px;margin-top:6px;}
.niv-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.niv-chip{padding:10px 4px;border-radius:12px;border:2px solid #e2e8f0;cursor:pointer;text-align:center;background:#f8fafc;transition:all .15s;}
.niv-chip:hover{border-color:var(--p);background:var(--selbg);}
.niv-chip.sel{border-color:var(--p);background:var(--selbg);}
.niv-chip .nc{font-size:16px;font-weight:800;color:var(--d);}
.niv-chip .nn{font-size:10px;color:#64748b;margin-top:2px;line-height:1.2;}
.rg{display:flex;flex-direction:column;gap:8px;}
.ro{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-radius:12px;border:2px solid #e2e8f0;cursor:pointer;background:#f8fafc;transition:all .15s;}
.ro:hover{border-color:var(--p);background:var(--selbg);}
.ro.sel{border-color:var(--p);background:var(--selbg);}
.ro:focus-visible,.chip:focus-visible,.niv-chip:focus-visible{outline:3px solid rgba(165,197,0,.5);outline-offset:2px;}
.ro input{margin-top:3px;accent-color:var(--d);flex-shrink:0;pointer-events:none;}
.rl{font-size:13px;font-weight:600;color:var(--d);}
.rd{font-size:12px;color:#64748b;margin-top:2px;line-height:1.45;}
.rd a{color:var(--d);}
.sub{margin:8px 0 2px 30px;display:flex;flex-direction:column;gap:6px;}
.sub .ro{padding:8px 12px;background:white;}
.inl{margin-top:8px;}
.nr{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;}
.bb{background:white;border:2px solid #e2e8f0;color:#64748b;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;}
.bb:hover{border-color:#94a3b8;color:#334155;}
.bb:disabled{opacity:.4;cursor:default;}
.bn{background:var(--d);color:white;border:none;border-radius:10px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;font-family:inherit;}
.bn:hover{background:#004d8c;transform:translateY(-1px);}
.em{font-size:12.5px;color:#ef4444;text-align:center;min-height:18px;margin-top:8px;}
.av{background:#f0f4f8;border:2px dashed #cbd5e1;border-radius:12px;padding:12px 15px;}
.av p,.av li{font-size:12.5px;color:#475569;line-height:1.55;}
.av ul{margin:4px 0 0 18px;}
.tb{background:var(--ib);border:1.5px solid var(--ibb);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--it);margin-top:14px;line-height:1.55;}
.tb a{color:var(--it);}
.wb2{background:var(--w);border:1.5px solid var(--wb);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--wt);margin-top:14px;line-height:1.55;}
.wb2 a{color:var(--wt);}
.mg{margin-top:14px;border:2px solid var(--p);border-radius:14px;padding:14px 16px;background:#fbfdf4;}
.mg-t{font-size:14px;font-weight:800;color:var(--d);margin-bottom:4px;}
.mg-i{font-size:12.5px;color:#475569;line-height:1.55;margin-bottom:10px;}
.mg-drop{border:2px dashed #94a3b8;border-radius:12px;padding:18px 12px;text-align:center;font-size:13px;font-weight:600;color:var(--d);background:white;cursor:pointer;transition:all .15s;}
.mg-drop:hover,.mg-drop.over{border-color:var(--p);background:var(--selbg);}
.mg-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
.mg-row{display:flex;align-items:center;gap:8px;background:white;border:1.5px solid #e2e8f0;border-radius:10px;padding:6px 8px;}
.mg-row.warn{border-color:var(--wb);background:#fffbeb;}
.mg-row input{flex:1;min-width:0;border:1.5px solid #e2e8f0;border-radius:8px;padding:6px 9px;font-size:13.5px;font-family:inherit;}
.mg-meta{font-size:11.5px;color:#64748b;white-space:nowrap;}
.mg-w{font-size:11.5px;color:var(--wt);}
.mg-btn{border:none;background:#f1f5f9;border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:13px;color:#475569;flex-shrink:0;}
.mg-btn:hover{background:#e2e8f0;}
.mg-sum{margin-top:10px;font-size:12.5px;color:#334155;}
.mg-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;}
.mg-err{margin-top:8px;font-size:12px;color:var(--err);}
.mg-dl{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:none;background:var(--d);color:white;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
.mg-dl:disabled{opacity:.4;cursor:default;}
@media(max-width:540px){.mg-row{flex-wrap:wrap;}.mg-row input{flex-basis:100%;}.mg-meta{flex:1;}.mg-w{order:5;flex-basis:100%;}}
details.fold{margin-top:10px;border:2px solid #e2e8f0;border-radius:12px;background:#f8fafc;overflow:hidden;}
details.fold summary{padding:10px 14px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--d);list-style:none;}
details.fold summary::-webkit-details-marker{display:none;}
details.fold summary:hover{background:var(--selbg);}
details.fold summary:before{content:"▸ ";color:#94a3b8;}
details.fold[open] summary:before{content:"▾ ";}
details.fold .fb{padding:4px 16px 14px;font-size:12.5px;color:#475569;line-height:1.6;}
details.fold .fb ol,details.fold .fb ul{margin:4px 0 0 18px;}
details.fold .fb li{margin-bottom:5px;}
details.fold .fb textarea{margin-top:6px;}
code{background:#e8edf3;border-radius:4px;padding:1px 5px;font-size:11.5px;font-family:Consolas,Monaco,monospace;}
.fstat{font-size:12px;margin-top:6px;line-height:1.45;}
.fstat.ok{color:var(--ok);}.fstat.err{color:var(--err);}.fstat.leer{color:#64748b;}
.chain{display:flex;flex-direction:column;gap:18px;margin-top:6px;}
.ci{border:2px solid #e2e8f0;border-radius:14px;padding:14px 14px 12px;background:#fcfdfe;}
.ch{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.cn{width:28px;height:28px;border-radius:50%;background:var(--d);color:white;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ct{font-size:14px;font-weight:800;color:var(--d);}
.chh{font-size:12px;color:#64748b;margin-top:2px;line-height:1.45;}
.rb{background:#f0f4f8;border:2px solid #e2e8f0;border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.65;color:#1e293b;max-height:340px;overflow-y:auto;margin-bottom:10px;white-space:pre-wrap;word-break:break-word;}
.cb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 20px;background:var(--p);color:var(--d);font-size:14px;font-weight:800;border:none;border-radius:12px;cursor:pointer;transition:all .2s;box-shadow:0 3px 10px rgba(165,197,0,.35);font-family:inherit;}
.cb:hover{background:#8fb000;}
.cb.ok{background:#22c55e;color:white;}
.dl{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:9px 16px;border-radius:10px;border:2px solid var(--d);color:var(--d);font-weight:700;font-size:13px;text-decoration:none;background:white;}
.dl:hover{background:var(--selbg);}
.sect{margin-top:22px;}
.sect-t{font-size:12px;font-weight:800;color:var(--d);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.foot-ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1.5px dashed #cbd5e1;}
.foot-ctrl .ro{flex:1;min-width:240px;}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.lc{padding:18px 16px;border-radius:14px;border:2px solid #e2e8f0;cursor:pointer;text-align:center;background:#f8fafc;}
.lc:hover{border-color:var(--p);background:var(--selbg);}
.lc .fl{font-size:28px;margin-bottom:4px;}.lc .ln{font-size:15px;font-weight:700;color:var(--d);}
footer{text-align:center;padding:16px;font-size:11px;color:#94a3b8;border-top:1px solid #e2e8f0;margin-top:10px;}
footer a{color:inherit;opacity:.8;text-decoration:none;}
footer a:hover{text-decoration:underline;}
@media (max-width: 600px){
  .hi{padding:12px 16px;gap:10px;}
  .ht h1{font-size:18px;}
  .hs{padding:7px 16px;}
  .hs span{font-size:12px;}
  .ww{padding:16px 12px 48px;}
  .sc{padding:18px 16px 16px;border-radius:14px;}
  .st{font-size:17px;}
  .sh{font-size:14px;}
  .niv-grid{grid-template-columns:repeat(3,1fr);gap:6px;}
  .bb,.bn{padding:11px 16px;font-size:14px;}
  .rb{font-size:13px;}
  .sub{margin-left:12px;}
}
</style>

<body>
<header class="gh">
  <div class="hi">
    <div class="ht"><h1 id="appTitle">Prompt Generator für Lehrkräfte</h1></div>
    <img class="him" src="logo.jpg" width="72" height="72" alt="">
  </div>
</header>
<div class="hs"><span id="tagline"></span></div>
<div class="ww">
  <div class="pp" id="pips"></div>
  <div class="pi"><span id="slbl"></span><span id="scnt"></span></div>
  <div class="sc" id="sc"></div>
  <div class="em" id="em" role="alert"></div>
  <div class="nr" id="navrow">
    <button class="bb" id="bb" onclick="nav(-1)"></button>
    <button class="bn" id="bn" onclick="cur === STEPS - 1 ? neuStart() : nav(1)"></button>
  </div>
</div>
<footer id="footer"></footer>

<script>
/* ======================================================================
   Prompt Generator für Lehrkräfte
   ----------------------------------------------------------------------
   Aufbau dieser Datei
   1. CONFIG        – Einstellungen, die du ohne Programmierkenntnisse
                      anpassen kannst (Sprachen mit Skript, Pfade, Links).
   2. LANG_PACKS    – alle Texte je Oberflächensprache: Beschriftungen (ui),
                      Bewertungskriterien und die Bausteine der Prompts.
                      Eine neue Oberflächensprache = einen neuen Block
                      anlegen (z. B. LANG_PACKS.en) – sobald es mehr als
                      einen Block gibt, erscheint automatisch ein
                      Startbildschirm zur Sprachwahl.
   3. Zustand, Speichern, Prüfungen
   4. Oberfläche (render…)
   ====================================================================== */

/* ---------------------------------------------------------------- 1 -- */
var CONFIG = {
  /* Zielsprachen, für die es ein Transkriptionsskript gibt. Nur bei diesen
     erscheinen die Quellen „ALLE_TRANSKRIPTE.txt“ und „Einzelanalyse“. */
  SKRIPT_SPRACHEN: ["de"],
  /* Wortlisten zum Download: Datei <Pfad><sprache>_<niveau>.txt, z. B.
     /teachers/wortlisten/de_A2.txt (aufbauend: A2 enthält A1). Fehlt eine
     Datei, erscheint kein Button. B1 bewusst nicht: aufbauend rund 11.000
     Tokens, zusammen mit den Transkripten zu groß für kostenlose KI-Konten. */
  WORTLISTE_NIVEAUS: ["A1", "A2"],
  WORTLISTE_PFAD: "wortlisten/",
  KURS_URL: "https://courses.promptgenerator.site/transcription",
  KURS_DATENSCHUTZ_URL: "https://courses.promptgenerator.site/transcription/nutzen#03-3",
  STORAGE_KEY: "pgTeachers.settings.v1",
  /* Höchstlänge der Ergebnisdaten im vorausgefüllten Formular-Link (getestet: 1.475 Zeichen) */
  FORM_DATEN_MAX: 1500
};

var ZIELSPRACHEN = ["de", "en", "fr", "es"];
/* Zielstrukturen zum Anklicken (Schritt 3), je Zielsprache und Niveau.
   Deutsch: abgeglichen mit dem Goethe-Curriculum A1–C2 (Formen und Strukturen),
   nur Strukturen, die im mündlichen Deutsch vorkommen. Kein Komma in den
   Beschriftungen: Das Feld wird an Kommas in einzelne Strukturen geteilt.
   Weitere Sprachen später ergänzen; fehlt ein Eintrag, bleibt nur das Freitextfeld. */
var ZIELSTRUKTUREN = {
  de: {
    A1: ["Verbposition in Aussage und W-Frage", "Ja-/Nein-Fragen", "Präsens (auch haben/sein)", "Modalverben (können/müssen/wollen/möchten)", "trennbare Verben", "Imperativ", "Akkusativ (Artikel und Pronomen)", "Negation mit nicht/kein", "Possessivartikel", "Perfekt (häufige Verben)", "war/hatte", "Zeitangaben (am/um/von … bis)"],
    A2: ["Perfekt mit haben/sein", "Präteritum von haben/sein und Modalverben", "Dativ (Artikel und Pronomen)", "Verben mit Dativ (gefallen/helfen/gehören)", "Wechselpräpositionen (wo?/wohin?)", "Adjektivendungen", "Nebensätze mit weil/dass/wenn", "denn/deshalb", "Temporalsätze mit als/wenn/bis/seit", "Komparativ und Superlativ", "reflexive Verben", "Verben mit Präposition (warten auf/denken an)", "Relativsätze (Nominativ/Akkusativ)", "Passiv Präsens", "höfliche Bitten (hätte gern/könnte/würde)"],
    B1: ["Plusquamperfekt", "Temporalsätze mit bevor/nachdem/während", "indirekte Fragen mit ob/W-Wort", "Infinitiv mit zu", "Relativsätze mit Dativ/Präposition", "Relativsätze mit was/wo", "Konjunktiv II (Wunsch/Rat/irreale Bedingung)", "Verben mit Präposition und da-/wo-Wörter", "damit/um … zu", "obwohl/trotzdem", "so … dass", "je … desto", "Futur I", "Passiv mit Modalverb"],
    B2: ["Konjunktiv II der Vergangenheit", "irreale Wünsche und Vorwürfe", "als ob + Konjunktiv II", "Modalverben subjektiv (soll/muss … sein)", "lassen + Infinitiv", "nicht nur … sondern auch/sowohl … als auch", "zwar … aber/einerseits … andererseits", "weder … noch", "falls/sobald/solange", "indem/ohne dass/anstatt dass"],
    C1: ["subjektloses Passiv", "Modalverben subjektiv (Vertiefung)", "es als Platzhalter (Es freut mich …)", "Funktionsverbgefüge", "es sei denn/außer wenn", "wenn … auch/wie … auch", "und zwar/beziehungsweise/vielmehr", "Hervorhebung durch Vorfeld/Nachfeld", "Aufforderungen in verschiedenen Registern"]
  }
};
var NIVEAUS_REIHE = ["A1", "A2", "B1", "B2", "C1", "C2"];
/* Transkript-Rubriken: beobachtbare Goethe-Kriterien, ohne Aussprache.
   Herleitung und Grenzen: teachers/BEWERTUNG.md. */
var BEWERTUNGSRUBRIKEN = {
  A1: { quelle: "Start Deutsch 1", art: "sprechakte" },
  A2: { quelle: "Goethe-Zertifikat A2", kriterien: [
    ["Aufgabenerfüllung und Verständlichkeit", 10, "Erfüllt die Gesprächsaufgabe und sind die Beiträge verständlich?"],
    ["Sprache", 10, "Sind Wortwahl und sprachliche Formen für A2 angemessen, ohne die Verständigung wesentlich zu stören?"]
  ] },
  B1: { quelle: "Goethe-Zertifikat B1", kriterien: [
    ["Aufgabenerfüllung", 36, "Werden die geforderten Sprachhandlungen in Inhalt und Umfang bewältigt?"],
    ["Interaktion", 8, "Geht die Person auf die KI ein und führt das Gespräch mit?"],
    ["Wortschatz und Register", 20, "Passen Wortwahl und Ausdruck zur Situation?"],
    ["Strukturen", 20, "Sind die verwendeten Formen für B1 angemessen und verständlich?"]
  ] },
  B2: { quelle: "Goethe-Zertifikat B2", kriterien: [
    ["Aufgabenerfüllung", 18, "Werden die geforderten Sprachhandlungen inhaltlich bewältigt?"],
    ["Kohärenz", 8, "Sind Gedanken und Beiträge sinnvoll aufgebaut und verknüpft?"],
    ["Wortschatz", 18, "Sind Spektrum und Wortwahl für B2 angemessen?"],
    ["Strukturen", 22, "Sind Spektrum und Beherrschung der Formen für B2 angemessen?"],
    ["Antwortverhalten", 8, "Werden Fragen inhaltlich passend aufgegriffen und beantwortet?"],
    ["Interaktion", 10, "Wird das Gespräch situations- und partnergerecht mitgestaltet?"]
  ] },
  C1: { quelle: "Goethe-Zertifikat C1", kriterien: [
    ["Aufgabenerfüllung", 14, "Werden Inhalt und geforderte Sprachhandlungen differenziert bearbeitet?"],
    ["Kohärenz", 10, "Sind Gedanken und Beiträge klar aufgebaut und präzise verknüpft?"],
    ["Wortschatz", 20, "Sind Spektrum und Wortwahl für C1 differenziert und treffend?"],
    ["Strukturen", 22, "Sind Spektrum und Beherrschung der Formen für C1 angemessen?"],
    ["Antwortverhalten", 8, "Werden Fragen inhaltlich und sprachlich angemessen beantwortet?"],
    ["Interaktion", 10, "Wird das Gespräch flexibel und situationsgerecht geführt?"]
  ] },
  C2: { quelle: "Goethe-Zertifikat C2", kriterien: [
    ["Aufgabenerfüllung", 8, "Werden Inhalt und Sprachhandlungen differenziert und adressatengerecht bewältigt?"],
    ["Kohärenz", 8, "Sind die Beiträge klar, flexibel und wirkungsvoll verknüpft?"],
    ["Wortschatz", 8, "Sind Spektrum und Wortwahl präzise und nuanciert?"],
    ["Strukturen", 8, "Werden vielfältige Formen sicher und angemessen verwendet?"]
  ] }
};
/* Übersetzungssprachen für Wortschatzlisten (die Zielsprache wird ausgeblendet). */
var WORT_SPRACHEN = ["Englisch", "Deutsch", "Französisch", "Spanisch", "Russisch", "Ukrainisch", "Arabisch", "Türkisch"];
var NIVEAUS = ["A1", "A2", "B1", "B2", "C1", "C2"];

/* ---------------------------------------------------------------- 2 -- */
var LANG_PACKS = {};

LANG_PACKS.de = {

    if (skript && S.kennzahlen === "erklaeren") {
      sec("KENNZAHLEN VERSTÄNDLICH ERKLÄRT");
      L.push(gruppe
        ? "Höchstens 5 Stichpunkte in einfachen Worten, ohne Fachbegriffe: Was sagen die Kennzahlen über diese Gruppe? Wo liegen die Lernenden nah beieinander, wo weit auseinander, wer fällt auf (Codes nennen)? Keine Niveaustufen."
        : "Höchstens 4 Stichpunkte in einfachen Worten, ohne Fachbegriffe: Was sagen die Kennzahlen über diese Aufnahme? Beschreibe nur, stufe nicht ein.");

    }

    if (skript && S.flussMarkieren) {
      sec("AUFFÄLLIG FLÜSSIGE AUFNAHMEN");
      L.push(gruppe
        ? "Nenne Aufnahmen, die im Vergleich zur Gruppe auffällig flüssig und vorformuliert wirken: viele Wörter zwischen Pausen, kaum Zögerungslaute oder Wiederholungen, sprachlich deutlich ausgefeilter als der Rest. Formuliere das als Hinweis zum Nachhören, nicht als Vorwurf – es gibt viele harmlose Gründe. Fällt keine auf, schreib das."
        : "Wirkt diese Aufnahme auffällig flüssig und vorformuliert (viele Wörter zwischen Pausen, kaum Zögerungslaute oder Wiederholungen, sprachlich ausgefeilter als für das Niveau zu erwarten)? Formuliere das als Hinweis zum Nachhören, nicht als Vorwurf. Wenn nicht, schreib das in einem Satz.");

    }

    if (gruppe && o.gruppe) {
      sec("SPANNBREITE DER GRUPPE");
      L.push("Höchstens 4 Sätze: Wie groß ist der Abstand zwischen den stärksten und den schwächsten Lernenden, und was folgt daraus für die Unterrichtsplanung (z. B. Differenzierung)?");

    }

    if (o.unterricht) {
      if (gruppe) {
        sec("UNTERRICHTSVORSCHLÄGE FÜR " + S.zeitrahmen + " MINUTEN");
        L.push("Sprachlicher Fokus: höchstens 3 Stichpunkte aus den beobachteten Fehlermustern" + (lz.length ? "; berücksichtige ausdrücklich den Lernziel-Check." : "."));
        L.push("Plane " + (S.zeitrahmen <= 15 ? "1–2 Aktivitäten" : S.zeitrahmen <= 45 ? "2–3 Aktivitäten" : "3–4 Aktivitäten") + ". Die Minutenangaben müssen zusammen genau " + S.zeitrahmen + " ergeben. Jede Aktivität muss ohne Ausdrucke oder eigens vorzubereitendes Material sofort durchführbar sein.");
        L.push("Gib für jede Aktivität knapp und in dieser Reihenfolge an: Nummer und Name | Zeit | konkretes Lernziel | Sozialform | 2–3 durchführbare Schritte für Lehrkraft und Lernende | einen wortwörtlich nutzbaren Arbeitsauftrag oder Beispielsatz zum beobachteten Fehlermuster | bei eindeutiger Lösung die Musterlösung. Vermeide bloße Themenhinweise wie „Vergangenheitsformen wiederholen“.");
        L.push("Verwende nur anonymisierte, für die Gruppe passende Beispiele ohne persönliche Angaben. Ist ein Beispielsatz von dir formuliert und nicht aus einem Transkript übernommen, kennzeichne ihn als Beispiel.");
        L.push("Nur wenn zusätzliches Material eine Aktivität sinnvoll ergänzt, füge darunter eine Zeile „Optionales KI-Material:“ mit einem direkt kopierbaren Folgeauftrag für denselben Chat an. Nenne darin Aktivitätsnummer, Materialart und Umfang, Zielniveau, relevantes Fehlermuster sowie bei eindeutig lösbaren Aufgaben die Lösungen. Die Lehrkraft soll mit diesem Auftrag das Material bei Bedarf später erzeugen können, ohne Transkripte erneut hochzuladen. Erstelle das Material jetzt noch nicht; wiederhole hier keine vollständigen Gruppenübungen oder Arbeitsblätter.");
      } else {
        sec("FÖRDEREMPFEHLUNGEN");
        L.push("3–4 konkrete Empfehlungen, woran diese Person als Nächstes arbeiten sollte, nach Wichtigkeit geordnet, je ein Satz.");
      }
      L.push("");
    }

    if (o.noten) {
      sec("ORIENTIERUNGSPUNKTZAHL (nur für mich – kein offizielles Prüfungsergebnis)");
      L.push(bewertungsRegeln(S, gruppe));
      L.push("Schreibe direkt unter die Tabelle genau diesen kurzen Hinweis, einmal für alle Personen: „Zur Punktzahl: Bewertet wurden nur im Transkript erkennbare Sprachhandlungen und Kriterien passend zum Zielniveau, orientiert an den Kriterien der mündlichen Goethe-Prüfungen; Aussprache wurde nicht berücksichtigt. Die Zahl stammt aus der KI-Auswertung eines Gesprächs und ist kein offizielles Goethe-Prüfungsergebnis.“" + (S.zielsprache !== "de" ? " Ergänze: „Für " + zs(S) + " wurden die Kriterien didaktisch übertragen.“" : ""));

    if (chainLen > 1) { L.push(""); L.push("Wenn du fertig bist, warte auf meinen nächsten Auftrag in diesem Chat."); }

  /* ---------- Feedback-Regeln (gemeinsam) ---------- */
  function feedbackRegeln(S, runden) {
    var L = [];
    if (S.fbSprache === "andere" && S.fbSpracheAndere.trim())
      L.push("Schreib das Feedback auf " + S.fbSpracheAndere.trim() + ". Zitate aus dem Transkript und Korrekturen bleiben auf " + zs(S) + ".");
    else
      L.push("Schreib das Feedback auf " + zs(S) + " – so einfach formuliert, dass eine Person auf Niveau " + S.niveau + " es versteht (kurze Sätze, bekannter Wortschatz).");
    L.push(anrede(S));
    L.push("Aufbau: zuerst 2 Stärken, dann 2–3 Punkte zum Verbessern – jeder mit einem Zitat aus dem eigenen Transkript und der richtigen Form –, zum Schluss 1 konkreter Tipp.");
    L.push(S.fbUmfang === "ausfuehrlich" ? "Erkläre jeden Verbesserungspunkt in 1–2 Sätzen." : "Halte dich kurz: insgesamt höchstens 4 Sätze plus die Beispiele.");
    if (lernzielZeilen(S).length) L.push("Geh, wo es passt, auf das Lernziel ein.");
    L.push("Nenne im Feedback keine Noten, Punktzahlen oder Niveaustufen.");
    if (isSkript(S)) {
      L.push("Lobe keine korrekten Endungen (die Spracherkennung glättet sie). Stellen, bei denen ein Erkennungsfehler wahrscheinlich ist, lässt du im Feedback an die Lernenden weg.");
      if (S.quelle === "alle") L.push("Steht eine Aufnahme unter „BITTE PRÜFEN“, setze vor ihr Feedback eine Zeile nur für mich: „[Für die Lehrkraft: bitte nachhören – Aufnahme unsicher oder sehr kurz]“.");
    }
    if (effOut(S).feedbackWort) {
      L.push("Persönliche Wortschatzliste: Füge am Ende jedes Feedbacks 5–8 Einträge an – Wörter, feste Wendungen oder ganze Sätze, die dieser Person im Gespräch gefehlt haben (erkennbar an Wechseln in eine andere Sprache, Umschreibungen, Fragen nach einem Wort" + (isSkript(S) ? ", langen Pausen direkt vor einem Nomen" : "") + "), die sie falsch verwendet hat oder die an einer Stelle gut gepasst hätten. Nur Einträge, die zum Thema der Aufgabe und zum Niveau passen. Gib die Liste in einem Codeblock aus. " + wortFormSatz(S));
    }
    L.push("Überschrift jedes Feedbacks: " + (S.quelle === "app" ? "der Name." : "der Code."));
    return L.join("\n");
  }

  function lernpromptSpec(S, umfangText) {
    return "ÜBUNGS-PROMPT FÜR LERNENDE: Schreib einen fertigen Prompt in einem Codeblock, den " + umfangText + " in die eigene KI (z. B. Gemini oder ChatGPT) einfügen kann. Darin soll die KI: sich kurz vorstellen; die Übungen einzeln stellen und jeweils auf die Antwort warten; sofort sagen, ob die Antwort stimmt; bei Fehlern kurz erklären und einen zweiten Versuch erlauben; nach dem zweiten Fehlversuch die Lösung zeigen; am Ende zusammenfassen, was gut lief und was noch geübt werden sollte. Bei Aufgaben mit genau einer zu korrigierenden Stelle akzeptiert sie sowohl das richtige Wort bzw. die richtige Wendung allein als auch den vollständig korrigierten Satz. Erklärungen " + erklSprache(S) + ". " + anrede(S) + " Der Prompt enthält alle Übungen und Lösungen, die Lösungen zeigt die KI aber erst nach der Antwort.";
  }

  function blattSpec(mitLoesungEnde) {
    return "ARBEITSBLATT: Nummerierte Übungen mit je einer kurzen Arbeitsanweisung. " + (mitLoesungEnde ? "Die Lösungen gesammelt am Ende unter der Überschrift „Lösungen“. " : "") + "Einfache Formatierung, die sich gut in ein Textdokument kopieren lässt.";
  }

  function htmlSpec(S, modus) {
    var f = parseFormLink(S.formLink), L = [];
    L.push("INTERAKTIVE ÜBUNGSSEITE: Erstelle " + (modus === "individuell" ? "vollständige HTML-Dateien" : "eine einzige, vollständige HTML-Datei") + " – jeweils HTML, CSS und JavaScript in einer Datei, ohne externe Dateien, Bibliotheken oder Schriften. Jede Datei muss eigenständig im Browser und auf dem Handy gut funktionieren. Wenn du eine Canvas- oder Artefakt-Funktion hast, nutze sie; sonst gib jede vollständige Datei in einem eigenen Codeblock aus.");
    L.push("Ablauf der Seite:");
    if (modus === "individuell") {
      L.push("- Startbildschirm mit einem Eingabefeld „Dein Code“. Nach der Eingabe erscheinen nur die Übungen zu diesem Code (Groß-/Kleinschreibung egal). Unbekannter Code → freundliche Meldung. Zeige nirgends eine Liste der Codes.");
    } else if (modus === "gruppe") {
      L.push(S.quelle === "app"

    L.push("- Jede Aufgabe hat höchstens zwei Versuche. Bestätige eine richtige Antwort sofort. Nach dem ersten falschen Versuch gib einen konkreten Tipp zum Fehler, ohne die Lösung zu verraten, und erlaube einen zweiten Versuch. Nach dem zweiten falschen Versuch zeige die richtige Lösung mit einer kurzen Erklärung.");
    L.push("- Prüfe Antworten tolerant: überflüssige Leerzeichen und abschließende Satzzeichen ignorieren, mehrere inhaltlich richtige Formulierungen akzeptieren. Groß-/Kleinschreibung nur dann als Fehler werten, wenn sie das Lernziel der Aufgabe ist. Zeige Musterlösungen immer mit korrekter Rechtschreibung, Groß-/Kleinschreibung und Zeichensetzung.");
    L.push("- Bei einer Korrekturaufgabe mit genau einer fehlerhaften Stelle (z. B. „Ändere nur die fehlerhafte Stelle“) ist sowohl das korrigierte Wort bzw. die korrigierte Wendung allein als auch der vollständig korrigierte Satz richtig. Hinterlege und prüfe beide Antwortformen im JavaScript; verlange nicht den ganzen Satz, wenn die Aufgabe nur nach einer Stelle fragt. Bei Umformungs- oder Wortstellungsaufgaben darfst du dagegen ausdrücklich einen ganzen Satz verlangen.");
    L.push("- Ergebnisbildschirm: Code, erreichte Punkte (richtig im ersten oder zweiten Versuch), Datum und ein Abschluss-Code im Format CODE-PUNKTE-TTMM-PZ. PZ ist eine zweistellige Prüfziffer: Summe der Zeichencodes von „CODE-PUNKTE-TTMM“ modulo 97.");
    if (f.state === "ok") {

      L.push("- Zeige außerdem den Hinweis: „Erst abschicken, dann ist deine Lehrkraft informiert.“");
    } else {
      L.push("- Zeige am Ende den Hinweis: „Schick deiner Lehrkraft einen Screenshot dieser Seite oder den Abschluss-Code.“");
    }
    L.push("- Gestaltung: schlicht, gut lesbar, große Schaltflächen. Alle Texte der Seite " + erklSprache(S) + ". " + anrede(S));
    if (modus === "individuell") L.push("Eine Übung ist genau eine einzeln zu beantwortende Aufgabe, kein Block mit mehreren Teilaufgaben. Zähle diese Aufgaben über alle Personen hinweg. Bis einschließlich 20 Aufgaben erstelle eine HTML-Datei für alle. Bei mehr als 20 Aufgaben verteile die Personen auf möglichst wenige eigenständige HTML-Dateien mit höchstens 20 Aufgaben je Datei. Teile die Aufgaben einer Person nie auf mehrere Dateien auf; falls eine Person allein mehr als 20 Aufgaben hat, darf ihre Datei diese Grenze überschreiten. Werte trotzdem alle Personen aus, ohne eine feste Zahl von Lernenden pro Datei vorzugeben. Nenne vor den Dateien für jede Datei den Dateinamen, die Anzahl der Aufgaben und die enthaltenen Codes als Übersicht nur für die Lehrkraft; zeige diese Übersicht nicht auf der Übungsseite. Gib nur vollständig abgeschlossene Dateien aus, keine HTML-Fragmente. Passen nicht alle vollständigen Dateien in eine Antwort, nenne die noch fehlenden Codes und setze mit der nächsten Datei nach „weiter“ fort.");
    return L.join("\n");
  }

  function moodleSpec() {
    return "MOODLE-QUIZ (GIFT-FORMAT): Gib alle Übungen als Fragen im GIFT-Format in einem einzigen Codeblock aus, damit ich sie als .txt speichern und in Moodle importieren kann. Regeln: Jede Frage beginnt mit einem Titel in der Form ::Titel::. Erlaubte Fragetypen: Multiple Choice {=richtig ~falsch ~falsch}, Lückentext/Kurzantwort {=Antwort1 =Antwort2}, Richtig/Falsch {T} oder {F}, Zuordnung {=a -> 1 =b -> 2}. Hinterlege bei Kurzantworten alle sinnvollen richtigen Varianten – lieber Auswahlaufgaben als offene Lücken mit vielen möglichen Lösungen. Maskiere die Zeichen ~ = # { } : im Fragetext mit einem vorangestellten Backslash. Zwischen zwei Fragen genau eine Leerzeile. Rückmeldung zu falschen Antworten mit #Erklärung direkt hinter der jeweiligen Antwort.";
  }

  function formatListe(S, erlaubt) {

  /* ---------- Feedback für alle Personen (Gruppen-Quellen) ---------- */
  P.feedback = function (S) {
    var L = [];
    L.push("FEEDBACK FÜR JEDE/N LERNENDE/N");
    L.push("");
    L.push("Schreib jetzt für jede Person ein Feedback, das ich direkt weitergeben kann. Es gelten die Grundregeln aus meinem ersten Auftrag.");
    L.push("");
    L.push(feedbackRegeln(S, true));
    if (S.feedbackUeb) {
      var f = formatListe(S, ["blatt", "lernprompt", "html"]);
      L.push("");
      L.push("Hänge an jedes Feedback kurze Übungen zu den Fehlern dieser Person an – nur Fehler, die sie selbst gemacht hat. " + einzelUebZeitSatz(S, "ihrem Transkript"));
      L.push("Wechsle die Übungsformen ab (z. B. Lückentext, Auswahl, Sätze ordnen, Umformen, Fehler finden), damit nicht jede Person dieselbe Form bekommt.");
      if (f.indexOf("blatt") >= 0) L.push("Form: Arbeitsanweisung und Aufgabe, darunter abgesetzt „Lösung:“.");
      if (f.indexOf("lernprompt") >= 0) L.push(lernpromptSpec(S, "diese Person"));
      if (f.indexOf("html") >= 0) L.push("Gib alle Übungen vollständig mit Lösung an – daraus baust du später eine interaktive Seite.");
      var ws = wortlisteSatz(S), en = endungenUebSatz(S, false);
      if (ws) L.push(ws.trim());

  P.feedbackFortsetzen = function (S) {

      "FORTSETZUNG DES FEEDBACKS NACH EINER UNVOLLSTÄNDIGEN ANTWORT",

      "Nenne am Ende die Anzahl und " + kennungen(S) + " der in diesem Nachtrag vollständig bearbeiteten Personen sowie die Gesamtzahl und " + kennungen(S) + " aller bisher vollständig bearbeiteten Personen. Nenne ausdrücklich, welche Personen aus der Datei noch fehlen, falls erneut nicht alle in eine Antwort passen.",

function nav(dir) {
  if (dir === 1) {
    var err = validate(cur);
    if (err) { document.getElementById("em").textContent = err; return; }
  }
  cur = Math.max(0, Math.min(STEPS - 1, cur + dir));
  if (cur === STEPS - 1) { speichern(); try { if (window.plausible) plausible("Teachers Prompt Generated", { props: { quelle: S.quelle, sprache: S.zielsprache } }); } catch (e) {} }
  render();
  window.scrollTo(0, 0);
}

function copyPrompt(text, btn, lbl, original) {
  function done() {
    btn.classList.add("ok"); lbl.textContent = t("copied");
    setTimeout(function () { btn.classList.remove("ok"); lbl.textContent = original; }, 1800);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
  else { fallbackCopy(text); done(); }
}
function doCopy(i) {
  var text = buildChain(S)[i].text;
  copyPrompt(text, document.getElementById("cpb" + i), document.getElementById("cpl" + i), "📋 " + t("copy") + " " + NUM[i]);
}
function doCopyFeedbackResume() {
  copyPrompt(PACK().prompt.feedbackFortsetzen(S), document.getElementById("cpbResume"), document.getElementById("cplResume"), "📋 " + t("copy"));
}
function fallbackCopy(text) {
  var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
  document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta);
}

/* Tastatur: Enter/Leertaste wählt Kacheln und Optionen aus */
document.addEventListener("keydown", function (e) {
  var el = e.target;
  if ((e.key === "Enter" || e.key === " ") && el && el.matches && el.matches(".ro,.chip,.niv-chip,.lc")) { e.preventDefault(); el.click(); }
});
