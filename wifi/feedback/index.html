<!DOCTYPE html>
<!-- Vorlage v1.4 -->
<html lang="de">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feedback und Übungen</title>
<style>
:root{
  color-scheme:light;--bg:#F1F6EC;--card:#FFFFFF;--tx:#2C3328;--mu:#5E665A;--bd:#D3E2C8;
  --navy:#2D8800;--navy2:#2D8800;
  --blue:#2D8800;--red:#C62828;--green:#2D8800;--gold:#E8A500;
  --ok:#14703F;--okbg:#E2F3E9;--no:#B3261E;--nobg:#FBE8E5;
  --tipbg:#FFF3CC;--tipx:#5C4400;--impbg:#FFF9E6;
  --gram-bg:#E3F0D8;--gram-tx:#1F4D0A;
  --wort-bg:#FFEFBF;--wort-tx:#6B4E00;
  --rede-bg:#EEE5F7;--rede-tx:#4E2B77;
  --btn:#2D8800;--btntx:#FFFFFF;--shadow:0 1px 4px rgba(0,0,0,.10);
  --track:#DCEBD2;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:0 16px 24px}
h1,h2{line-height:1.2;margin:0}
.hero{display:flex;align-items:center;gap:14px;background:#2D8800;color:#fff;padding:10px 16px;margin:0 -16px;position:relative}
.hero.big{padding:12px 16px}
.hero .logo{flex:none;width:52px;height:66px;background:#fff;border-radius:3px;padding:3px;display:flex;align-items:center;justify-content:center}
.hero .logo img{max-width:100%;max-height:100%;display:block}
.hero h1{font-size:1.2rem;color:#fff;font-weight:800;line-height:1.15}
.hero .kurs{white-space:nowrap;font-style:normal;font-weight:700;font-size:.74rem;letter-spacing:.2px;margin-top:5px;background:rgba(255,255,255,.18);display:inline-block;padding:2px 8px;border-radius:3px}
.hero.big .logo{width:92px;height:114px;padding:4px}
.hero.big h1{font-size:1.55rem}
.hero.big p{font-size:1.05rem}
.hero p{margin:2px 0 0;font-size:.9rem;font-style:italic;color:#fff;text-wrap:balance}
.stripe{display:block;height:0;margin:0 0 16px}.stripe i{flex:1}
.stripe i:nth-child(1){background:#1F6100}.stripe i:nth-child(2){background:#329900}.stripe i:nth-child(3){background:#8FCB63}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.card.wide{margin:0 -16px;border-radius:0;border-left:0;border-right:0}
.card h2{font-size:1.12rem;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ic{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;flex:none}
.ic svg{width:19px;height:19px}
.c-ok{border-left:6px solid var(--green)}.c-ok .ic{background:var(--okbg);color:var(--ok)}
.c-imp{border-left:6px solid var(--gold);background:var(--impbg)}.c-imp .ic{background:var(--tipbg);color:var(--tipx)}
.c-tip{border-left:6px solid #8FCB63}.c-tip .ic{background:var(--gram-bg);color:var(--gram-tx)}
.c-kz{border-left:6px solid var(--navy2)}.c-kz .ic{background:var(--gram-bg);color:var(--gram-tx)}
.kzgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kz{background:var(--bg);border-radius:14px;padding:12px}
.kz b{display:block;font-size:1.7rem;line-height:1.1;font-weight:800}
.kz span{display:block;font-size:.88rem;font-weight:650;margin-top:4px}
.kz small{display:block;color:var(--mu);font-size:.85rem;margin-top:6px;line-height:1.4}
.kzd{margin:0 0 4px}
.kz .kzs{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--bd);font-size:.88rem;line-height:1.4}
.kz .kzs b{display:inline;font-size:inherit;font-weight:700}
@media (max-width:420px){.kzgrid{grid-template-columns:1fr}}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:10px;margin:10px 0}.list li svg{flex:none;width:20px;height:20px;margin-top:4px;color:var(--ok)}
.pair{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.pair p{margin:0;display:flex;gap:9px}.pair svg{flex:none;width:20px;height:20px;margin-top:4px}
.pair .before{color:var(--no)}.pair .before span{text-decoration:line-through;text-decoration-thickness:2px}
.pair .after{color:var(--ok);font-weight:650;margin-top:6px}
.pair .why{color:var(--mu);font-size:.95rem;margin-top:8px;padding-left:29px}
label{font-weight:650;display:block;margin-bottom:8px}
input[type=text]{font:inherit;width:100%;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);min-height:54px}
input[type=text]::placeholder{font-size:.78rem}
input[type=text]:focus{outline:3px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.btn{font:inherit;font-weight:650;cursor:pointer;border-radius:4px;border:2px solid var(--btn);background:var(--btn);color:var(--btntx);padding:14px 20px;min-height:56px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.sec{background:transparent;color:var(--tx);border-color:var(--mu)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px}
.actions{position:sticky;bottom:0;z-index:5;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
.actions:empty{display:none}
.actions.static{position:static;background:none;padding:6px 0 10px}
.prog{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}.ring .tr{stroke:var(--track)}.ring .pr{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.ptxt b{display:block}.ptxt span{color:var(--mu);font-size:.92rem}
.segs{display:flex;gap:4px;margin-bottom:12px}
.segs i{flex:1;height:8px;border-radius:5px;background:var(--track)}
.segs i.ok1{background:var(--green)}.segs i.ok2{background:var(--gold)}.segs i.no{background:var(--red)}
.segs i.cur{outline:2px solid var(--blue);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font-size:.8rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:4px 11px;border-radius:99px}
.k-gram{background:var(--gram-bg);color:var(--gram-tx)}.k-wort{background:var(--wort-bg);color:var(--wort-tx)}.k-rede{background:var(--rede-bg);color:var(--rede-tx)}
.sub{font-size:.85rem;color:var(--mu);align-self:center}
.frage{font-weight:650;margin:0 0 10px}
.sat{font-size:1.15rem;font-weight:600;margin:6px 0 14px;padding:13px 14px;border-left:5px solid var(--blue);background:var(--bg);border-radius:8px}
.opt{font:inherit;cursor:pointer;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;margin-top:10px;padding:13px 14px;min-height:56px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;margin-top:1px}
.opt.bad{border-color:var(--no);background:var(--nobg)}.opt.bad .l{background:var(--no);color:#fff}
.opt.good{border-color:var(--green);background:var(--okbg)}.opt.good .l{background:var(--green);color:#fff}
.opt:disabled{cursor:default}
.msg{display:flex;gap:10px;padding:13px 14px;border-radius:14px;margin-top:14px}
.msg svg{flex:none;width:22px;height:22px;margin-top:2px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.no{background:var(--nobg);color:var(--no)}.msg.tip{background:var(--tipbg);color:var(--tipx)}
.msg div{color:var(--tx)}.msg b.h{color:inherit}
.msg.ok b.h{color:var(--ok)}.msg.no b.h{color:var(--no)}.msg.tip b.h{color:var(--tipx)}
.pop{animation:pop .35s ease-out}.shake{animation:shake .35s}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q-wrap{margin-top:4px}
.big{font-size:2.6rem;font-weight:800;line-height:1}
.mid{text-align:center}
.mid p{margin:.5em 0}
.res{position:relative;overflow:hidden}
.res .top{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--bd);padding-bottom:14px;margin-bottom:14px}
.res .top .logo{width:56px;height:52px;flex:none}.res .top .logo img{width:100%;height:100%;object-fit:contain}
.res .nm{font-size:1.25rem;font-weight:800}.res .dt{color:var(--mu);font-size:.92rem}
.total{display:flex;align-items:center;gap:18px;margin:6px 0 16px}
.total .ring{width:92px;height:92px}.total .ring svg{width:92px;height:92px}.total .ring b{font-size:1.15rem}
.bars .row{margin:11px 0}.bars .lab{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:5px;font-weight:600}
.bars .tr{height:12px;border-radius:7px;background:var(--track);overflow:hidden}.bars .fi{height:100%;border-radius:7px}
.fi.k-gram{background:var(--blue)}.fi.k-wort{background:var(--gold)}.fi.k-rede{background:#8B5CC8}
.sec2{display:flex;gap:10px;margin-top:14px}.sec2>div{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.92rem;color:var(--mu)}.sec2 b{display:block;color:var(--tx);font-size:1.1rem}
.next{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--tipbg);color:var(--tipx)}
.hint{color:var(--mu);font-size:.95rem;margin-top:12px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}.ring .pr{transition:none}.btn,.opt{transition:none}.confetti{display:none}}
@media(max-width:380px){.hero.big .logo{width:70px;height:88px}.hero.big h1{font-size:1.35rem}.hero .kurs{font-size:.68rem}}
@media(max-width:340px){.hero .kurs{white-space:normal}}
</style>
</head>

function start(msg){
  S={};
  show(hero(true)+'<div class="card wide"><label for="n">Dein Vorname</label><input id="n" type="text" autocomplete="off" autocapitalize="words" placeholder="Zum Beispiel: Mairam, Natalya, Zamzagul, Nurzat">'+
  (msg?'<div class="msg no" role="alert">'+ICON.cross+'<div>'+msg+'</div></div>':'')+
  '<div style="height:12px"></div><button class="btn" id="go">Weiter '+ICON.arrow+'</button></div>'+
  '<p class="hint" style="text-align:center">Dich erwarten dein persönliches Feedback und passende Übungen.</p>');
  var i=document.getElementById('n');
  function go(){
    var b=DB[hs(nameKey(i.value))];
    if(!b){start('Diesen Vornamen finde ich leider nicht. Prüfe bitte die Schreibweise und versuche es noch einmal.');return}
    S.p=dec(b);S.g=dec(GROUP_B64);feedback();
  }
  document.getElementById('go').onclick=go;
  i.onkeydown=function(e){if(e.key==='Enter')go()};
  i.focus();
}
function kzHtml(p){
  if(!p.kz)return '';
  var h='<section class="card c-kz"><h2><span class="ic">'+ICON.chart+'</span>Deine Zahlen aus der Aufnahme</h2><div class="kzgrid">';
  p.kz.z.forEach(function(k){h+='<div class="kz"><b>'+esc(k.w)+'</b><span>'+esc(k.l)+'</span><small>'+esc(k.e)+'</small>'+(k.s?'<p class="kzs"><b>Für dich:</b> '+esc(k.s)+'</p>':'')+'</div>'});
  return h+'</div><p class="kzd">'+esc(p.kz.d)+'</p><p class="hint" style="margin-bottom:0">'+esc(p.kz.h)+'</p></section>';
}
function feedback(){
  var p=S.p,h=hero(false)+'<h2 style="margin:6px 0 2px;font-size:1.5rem">Hallo '+esc(p.name)+'!</h2><p class="hint" style="margin:0 0 4px">Hier ist dein persönliches Feedback.</p>';
  h+='<section class="card c-ok"><h2><span class="ic">'+ICON.star+'</span>Das kannst du schon gut</h2><ul class="list">';
  p.st.forEach(function(x){h+='<li>'+ICON.check+'<span>'+esc(x)+'</span></li>'});
  h+='</ul></section><section class="card c-imp"><h2><span class="ic">'+ICON.pencil+'</span>Das kannst du verbessern</h2>';
  p.vb.forEach(function(v){h+='<div class="pair"><p class="before">'+ICON.cross+'<span>„'+esc(v.z)+'“</span></p><p class="after">'+ICON.check+'<span>'+esc(v.r)+'</span></p><p class="why">'+esc(v.e)+'</p></div>'});
  h+='</section>'+kzHtml(p)+'<section class="card c-tip"><h2><span class="ic">'+ICON.bulb+'</span>Dein Tipp</h2><p style="margin:0">'+esc(p.tipp)+'</p></section>';
  h+='<div class="actions"><button class="btn" id="b">Übungen für dich '+ICON.arrow+'</button></div>';
  show(h);
  document.getElementById('b').onclick=function(){S.list=p.ex;S.mode='p';S.res=[];S.pts=0;S.i=0;exercise()};
}
function exercise(){
  var ex=S.list[S.i];S.att=0;S.done=false;
  var segs='';for(var k=0;k<S.list.length;k++){segs+='<i class="'+(S.res[k]?S.res[k].s:(k===S.i?'cur':''))+'"></i>'}
  var h=hero(false)+'<div class="prog">'+ring(S.i,S.list.length,(S.i+1)+'/'+S.list.length)+'<div class="ptxt"><b>'+(S.mode==='p'?'Übungen für dich':'Übungen für alle')+'</b><span>Aufgabe '+(S.i+1)+' von '+S.list.length+'</span></div></div><div class="segs" aria-hidden="true">'+segs+'</div>'+
  '<section class="card q-wrap"><div class="chips"><span class="chip k-'+ex.kat+'">'+KAT[ex.kat]+'</span>'+(ex.sub?'<span class="sub">'+esc(ex.sub)+'</span>':'')+'</div><p class="frage">'+esc(ex.frage)+'</p>'+(ex.satz?'<div class="sat">'+esc(ex.satz)+'</div>':'')+'<div id="in"></div><div id="fb" role="status" aria-live="polite"></div></section><div class="actions" id="act"></div>';
  show(h);
  var box=document.getElementById('in'),act=document.getElementById('act');
  if(ex.type==='choice'){
    shuffle(ex.options).forEach(function(o,idx){var b=document.createElement('button');b.className='opt';b.innerHTML='<span class="l">'+'ABCD'[idx]+'</span><span></span>';b.lastChild.textContent=o;b.dataset.v=o;b.onclick=function(){check(o===ex.richtig,b)};box.appendChild(b)});
  }else{
    box.innerHTML='<input id="t" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Deine Antwort" placeholder="Deine Antwort">';
    act.innerHTML='<button class="btn" id="c">Prüfen '+ICON.check+'</button>';
    var t=document.getElementById('t'),c=document.getElementById('c');
    function run(){if(!t.value.trim())return;var v=norm(t.value);check(ex.ok.some(function(a){return norm(a)===v}),null)}
    c.onclick=run;t.onkeydown=function(e){if(e.key==='Enter')run()};t.focus();
  }
}
function check(good,btn){
  if(S.done)return;
  var ex=S.list[S.i],fb=document.getElementById('fb');S.att++;
  if(good){
    if(btn)btn.classList.add('good');
    finish(true,'<div class="msg ok pop">'+ICON.check+'<div><b class="h">'+(S.att===1?PRAISE[pr++%PRAISE.length]:'Richtig – im zweiten Versuch!')+'</b> '+esc(ex.erkl)+'</div></div>');return}
  if(btn){btn.classList.add('bad');btn.disabled=true;if(!reduced()){btn.classList.add('shake')}}
  else{var t=document.getElementById('t');if(t&&!reduced()){t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')}}
  if(S.att===1){fb.innerHTML='<div class="msg tip">'+ICON.bulb+'<div><b class="h">Noch ein Versuch.</b> Tipp: '+esc(ex.tipp)+'</div></div>';var t2=document.getElementById('t');if(t2){t2.focus();t2.select()}return}
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(o){if(o.dataset.v===ex.richtig)o.classList.add('good')});
  finish(false,'<div class="msg no">'+ICON.cross+'<div><b class="h">Das war nicht richtig.</b> Richtige Lösung: <b>'+esc(ex.loesung)+'</b><br>'+esc(ex.erkl)+'</div></div>');
}
function finish(ok,html){
  S.done=true;if(ok)S.pts++;
  var ex=S.list[S.i];S.res[S.i]={k:ex.kat,s:ok?(S.att===1?'ok1':'ok2'):'no'};
  var box=document.getElementById('in');Array.prototype.forEach.call(box.querySelectorAll('button,input'),function(x){x.disabled=true});
  document.getElementById('fb').innerHTML=html;
  var segs=document.querySelectorAll('.segs i');segs[S.i].className=S.res[S.i].s;
  var last=S.i===S.list.length-1,act=document.getElementById('act');
  act.innerHTML='<button class="btn" id="nx">'+(last?'Fertig':'Weiter')+' '+ICON.arrow+'</button>';
  var nx=document.getElementById('nx');nx.onclick=function(){if(!last){S.i++;exercise()}else if(S.mode==='p'){S.pp=S.pts;S.rp=S.res;mid()}else{S.gp=S.pts;S.rg=S.res;result()}};
  nx.focus({preventScroll:true});
  var fbEl=document.getElementById('fb'),over=fbEl.getBoundingClientRect().bottom-(window.innerHeight-110);
  if(over>0)window.scrollBy({top:over,behavior:reduced()?'auto':'smooth'});
}
function mid(){
  show(hero(false)+'<section class="card mid"><div class="big">'+S.pp+' von '+S.p.ex.length+'</div><p><b>Deine persönlichen Übungen sind fertig.</b></p><p class="hint">Jetzt kommen Übungen für alle. Sie zeigen typische Stolpersteine aus der ganzen Gruppe.</p></section><div class="actions"><button class="btn" id="b">Übungen für alle '+ICON.arrow+'</button></div>');
  document.getElementById('b').onclick=function(){S.list=S.g;S.mode='g';S.res=[];S.pts=0;S.i=0;exercise()};
}
function confetti(){
  if(reduced())return;
  var d=document.createElement('div');d.className='confetti';d.setAttribute('aria-hidden','true');
  var cols=['#1F6FD0','#D8352A','#1E8A4C','#F2B705'];
  for(var i=0;i<46;i++){var e=document.createElement('i');e.style.left=(Math.random()*100)+'%';e.style.background=cols[i%4];e.style.animationDuration=(2.4+Math.random()*2.2)+'s';e.style.animationDelay=(Math.random()*.9)+'s';e.style.transform='rotate('+(Math.random()*360)+'deg)';d.appendChild(e)}
  document.body.appendChild(d);setTimeout(function(){d.remove()},6000);
}
function result(){
  var dd=new Date(),ds=('0'+dd.getDate()).slice(-2)+'.'+('0'+(dd.getMonth()+1)).slice(-2)+'.'+dd.getFullYear();
  var all=S.rp.concat(S.rg),tot=S.pp+S.gp,max=all.length,cat={gram:[0,0],wort:[0,0],rede:[0,0]};
  all.forEach(function(r){cat[r.k][1]++;if(r.s!=='no')cat[r.k][0]++});
  var bars='',worst=null,wr=2;
  ['gram','wort','rede'].forEach(function(k){var c=cat[k];if(!c[1])return;var q=c[0]/c[1];if(q<wr){wr=q;worst=k}
    bars+='<div class="row"><div class="lab"><span>'+KAT[k]+'</span><span>'+c[0]+' von '+c[1]+'</span></div><div class="tr"><div class="fi k-'+k+'" style="width:'+Math.round(q*100)+'%"></div></div></div>'});
  var next;
  if(tot===max)next='Du hast alle Aufgaben geschafft. Weiter so!';
  else next={gram:'Zum Weiterüben: Wiederhole die Aufgaben zu Satzbau, Artikeln und Endungen.',wort:'Zum Weiterüben: Lerne feste Verbindungen und Wortfamilien immer in ganzen Sätzen.',rede:'Zum Weiterüben: Sprich feste Wendungen für Diskussion und Vortrag laut.'}[worst];
  show(hero(false)+'<section class="card res" id="shot"><div class="top"><div><div class="nm">'+esc(S.p.name)+'</div><div class="dt">Ergebnis · '+ds+'</div></div></div>'+
   '<div class="total">'+ring(tot,max,tot+'/'+max).replace('class="ring"','class="ring"')+'<div><div class="big">'+tot+' von '+max+'</div><div class="hint" style="margin:4px 0 0">Aufgaben richtig</div></div></div>'+
   '<div class="bars">'+bars+'</div>'+
   '<div class="sec2"><div>Übungen für dich<b>'+S.pp+' von '+S.p.ex.length+'</b></div><div>Übungen für alle<b>'+S.gp+' von '+S.g.length+'</b></div></div>'+
   '<div class="next">'+esc(next)+'</div><p class="hint">Als richtig zählt, was du im ersten oder zweiten Versuch richtig hattest.</p></section>'+
   '<div class="msg tip">'+ICON.bulb+'<div>Schick deiner Lehrkraft einen Screenshot dieser Seite.</div></div>'+
   '<div class="actions static"><button class="btn sec" id="b">Von vorn beginnen</button></div>');
  document.getElementById('b').onclick=function(){start()};
  confetti();
}
start();
})();
</script>
</body>
</html>
