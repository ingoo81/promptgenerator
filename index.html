<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--p:#a5c500;--d:#003468;--w:#fef3c7;--wb:#fcd34d;--wt:#92400e;--ib:#eff6ff;--ibb:#bfdbfe;--it:#1e40af;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f8fafc;font-family:'Segoe UI',Arial,sans-serif;}
.gh{background:var(--d);}
.hi{max-width:780px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:16px;}
.lb{display:flex;align-items:center;flex-shrink:0;}
.lg{background:var(--p);color:var(--d);font-size:10px;font-weight:800;letter-spacing:.05em;padding:4px 8px;border-radius:3px 0 0 3px;}
.li{background:white;color:var(--d);font-size:10px;font-weight:800;letter-spacing:.05em;padding:4px 8px;border-radius:0 3px 3px 0;}
.ht{flex:1;}.ht h1{font-size:19px;font-weight:800;color:white;margin-bottom:2px;}
.ht .sub{color:var(--p);font-size:12px;font-weight:500;}
.him{width:72px;height:72px;object-fit:cover;border-radius:50%;flex-shrink:0;border:3px solid rgba(165,197,0,.6);}
.hs{background:linear-gradient(135deg,var(--d) 0%,#005a8e 100%);padding:9px 24px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--p);}
.hs span{color:rgba(255,255,255,.85);font-size:12px;font-style:italic;}
.ww{max-width:780px;margin:0 auto;padding:26px 20px 50px;}
.pp{display:flex;gap:3px;margin-bottom:4px;}
.pip{height:4px;flex:1;border-radius:2px;background:#e2e8f0;transition:background .3s;}
.pip.done{background:var(--p);}.pip.active{background:var(--d);}
.pi{display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-bottom:18px;}
.sc{background:white;border-radius:20px;box-shadow:0 4px 24px rgba(0,52,104,.1);border:2px solid #e2e8f0;padding:26px 26px 22px;}
.ey{font-size:11px;font-weight:700;color:var(--p);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.st{font-size:19px;font-weight:800;color:var(--d);margin-bottom:5px;}
.sh{font-size:13px;color:#64748b;line-height:1.55;margin-bottom:20px;}
.fg{margin-bottom:14px;}.fg label{display:block;font-size:13px;font-weight:600;color:var(--d);margin-bottom:5px;}
.rq{color:#ef4444;}
input.ti,textarea.ti{width:100%;border:2px solid #e2e8f0;border-radius:10px;padding:10px 13px;font-size:14px;color:#1e293b;background:#f8fafc;font-family:inherit;transition:border-color .18s;}
input.ti:focus,textarea.ti:focus{outline:none;border-color:var(--p);background:white;box-shadow:0 0 0 3px rgba(165,197,0,.15);}
textarea.ti{min-height:75px;resize:vertical;}
textarea.ti.wsbox{min-height:90px;font-family:Consolas,Monaco,monospace;font-size:13px;}
.ng{display:flex;flex-direction:column;gap:7px;margin-top:4px;}
.ni{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;border:2px solid #e2e8f0;cursor:pointer;background:#f8fafc;transition:all .15s;}
.ni:hover{border-color:var(--p);background:#f0f8d8;}
.ni.sel{border-color:var(--p);background:#f0f8d8;}
.nb2{background:var(--d);color:white;font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;min-width:36px;text-align:center;flex-shrink:0;}
.ni.sel .nb2{background:var(--p);color:var(--d);}
.nn{font-size:13px;font-weight:600;color:var(--d);}.nd{font-size:11px;color:#64748b;margin-top:1px;}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.chip{padding:7px 15px;border-radius:20px;border:2px solid #e2e8f0;font-size:13px;cursor:pointer;background:#f8fafc;color:#334155;transition:all .15s;user-select:none;font-family:inherit;}
.chip:hover{border-color:var(--p);background:#f0f8d8;}
.chip.sel{background:var(--p);border-color:var(--p);color:var(--d);font-weight:700;}
.chip.cust{border-style:dashed;}
.chip.cust input{background:transparent;border:none;outline:none;font-size:13px;color:inherit;width:110px;font-family:inherit;}
.kchip{padding:10px 14px;border-radius:12px;border:2px solid #e2e8f0;font-size:13px;cursor:pointer;background:#f8fafc;color:#334155;transition:all .15s;user-select:none;font-family:inherit;width:100%;text-align:left;display:flex;flex-direction:column;gap:3px;}
.kchip:hover{border-color:var(--p);background:#f0f8d8;}
.kchip.sel{background:var(--p);border-color:var(--p);color:var(--d);font-weight:700;}
.kchip .kd{font-size:11px;opacity:.75;font-weight:400;}
.rg{display:flex;flex-direction:column;gap:8px;}
.ro{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-radius:12px;border:2px solid #e2e8f0;cursor:pointer;background:#f8fafc;transition:all .15s;}
.ro:hover{border-color:var(--p);background:#f0f8d8;}
.ro.sel{border-color:var(--p);background:#f0f8d8;}
.ro input[type=radio]{margin-top:3px;accent-color:var(--d);flex-shrink:0;}
.rl{font-size:13px;font-weight:600;color:var(--d);}
.rd{font-size:12px;color:#64748b;margin-top:2px;line-height:1.4;}
.av{background:#f0f4f8;border:2px dashed #cbd5e1;border-radius:12px;padding:14px 16px;margin-top:4px;}
.av p{font-size:12px;color:#64748b;line-height:1.5;}
.wb2{background:var(--w);border:1.5px solid var(--wb);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--wt);margin-top:12px;line-height:1.5;}
.nr{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
.bb{background:white;border:2px solid #e2e8f0;color:#64748b;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;}
.bb:hover{border-color:#94a3b8;color:#334155;}
.bn{background:var(--d);color:white;border:none;border-radius:10px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;font-family:inherit;}
.bn:hover{background:#004d8c;transform:translateY(-1px);}
.bn.gen{background:var(--p);color:var(--d);font-size:15px;padding:12px 28px;}
.bn.gen:hover{background:#8fb000;}
.em{font-size:12px;color:#ef4444;text-align:center;min-height:18px;margin-top:8px;}
.lg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.lc{padding:18px 16px;border-radius:14px;border:2px solid #e2e8f0;cursor:pointer;text-align:center;transition:all .18s;background:#f8fafc;}
.lc:hover{border-color:var(--p);background:#f0f8d8;}
.lc.sel{border:3px solid var(--p);background:#f0f8d8;}
.lc .fl{font-size:30px;margin-bottom:6px;}.lc .ln{font-size:15px;font-weight:700;color:var(--d);}
.lc .lnat{font-size:12px;color:#64748b;margin-top:2px;}
.rb{background:#f0f4f8;border:2px solid #e2e8f0;border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.8;color:#1e293b;max-height:420px;overflow-y:auto;margin-bottom:14px;white-space:pre-wrap;}
.rl2{font-size:11px;font-weight:700;color:var(--d);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 3px;display:block;}
.rv{font-size:13px;color:#334155;line-height:1.6;display:block;}
.rdiv{border:none;border-top:1.5px dashed #cbd5e1;margin:8px 0;}
.cb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 20px;background:var(--p);color:var(--d);font-size:14px;font-weight:800;border:none;border-radius:12px;cursor:pointer;transition:all .2s;box-shadow:0 3px 10px rgba(165,197,0,.35);font-family:inherit;}
.cb:hover{background:#8fb000;transform:translateY(-1px);}
.cb.ok{background:#22c55e;color:white;}
.tb{background:var(--ib);border:1.5px solid var(--ibb);border-radius:10px;padding:11px 14px;font-size:12px;color:var(--it);margin-top:14px;line-height:1.5;}
footer{text-align:center;padding:16px;font-size:11px;color:#94a3b8;border-top:1px solid #e2e8f0;margin-top:10px;}
.catgrid{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.catitem{border-radius:12px;border:2px solid #e2e8f0;background:#f8fafc;overflow:hidden;transition:border-color .15s;}
.catitem.open{border-color:var(--p);}
.cathead{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--d);}
.cathead:hover{background:#f0f8d8;}
.catitem.sel .cathead{background:#f0f8d8;color:var(--d);}
.catarrow{font-size:11px;color:#94a3b8;transition:transform .2s;}
.catitem.open .catarrow{transform:rotate(90deg);}
.sitlist{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px;}
.sititem{padding:8px 12px;border-radius:8px;border:1.5px solid #e2e8f0;background:white;font-size:12.5px;cursor:pointer;color:#334155;transition:all .15s;}
.sititem:hover{border-color:var(--p);background:#f6faeb;}
.sititem.sel{background:var(--p);border-color:var(--p);color:var(--d);font-weight:700;}
.owntheme{margin-top:10px;padding-top:10px;border-top:1.5px dashed #cbd5e1;}
.sfgrid{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.sfcat{border-radius:12px;border:2px solid #e2e8f0;background:#f8fafc;padding:10px 14px;}
.sfcathead{font-size:12.5px;font-weight:700;color:var(--d);margin-bottom:6px;}
.sfitems{display:flex;flex-wrap:wrap;gap:6px;}
.sfitem{padding:5px 11px;border-radius:14px;border:1.5px solid #e2e8f0;background:white;font-size:12px;cursor:pointer;color:#334155;transition:all .15s;}
.sfitem:hover{border-color:var(--p);background:#f6faeb;}
.sfitem.sel{background:var(--p);border-color:var(--p);color:var(--d);font-weight:700;}
.section-divider{margin:18px 0 14px;padding-top:14px;border-top:1.5px dashed #cbd5e1;}
.section-label{font-size:12px;font-weight:700;color:var(--d);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;}

.acc-item{border-radius:12px;border:2px solid #e2e8f0;background:#f8fafc;overflow:hidden;margin-bottom:8px;transition:border-color .15s;}
.acc-item.open{border-color:var(--p);}
.acc-head{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.acc-head-text{flex:1;min-width:0;}
.acc-head:hover{background:#f0f8d8;}
.acc-label{font-size:13px;font-weight:700;color:var(--d);}
.acc-value{font-size:12px;color:#64748b;margin-top:2px;}
.acc-desc-preview{font-size:11px;color:#94a3b8;margin-top:3px;line-height:1.4;font-style:italic;}
.acc-arrow{font-size:11px;color:#94a3b8;transition:transform .2s;flex-shrink:0;margin-top:2px;}
.acc-item.open .acc-arrow{transform:rotate(90deg);}
.acc-body{padding:4px 14px 14px;}
.acc-opt-single{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;border:2px solid #e2e8f0;cursor:pointer;background:white;margin-bottom:7px;transition:all .15s;}
.acc-opt-single:hover{border-color:var(--p);background:#f6faeb;}
.acc-opt-single.sel{border-color:var(--p);background:#f0f8d8;}
.acc-opt-multi{padding:10px 12px;border-radius:10px;border:2px solid #e2e8f0;cursor:pointer;background:white;margin-bottom:7px;transition:all .15s;}
.acc-opt-multi:hover{border-color:var(--p);background:#f6faeb;}
.acc-opt-multi.sel{border-color:var(--p);background:#f0f8d8;}
.acc-opt-title{font-size:12.5px;font-weight:600;color:var(--d);}
.acc-opt-desc{font-size:11.5px;color:#64748b;margin-top:2px;line-height:1.4;}

.rp-panel{margin-top:18px;border:2px solid #e2e8f0;border-radius:14px;overflow:hidden;}
.rp-head{padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--d) 0%,#005a8e 100%);font-size:12.5px;font-weight:700;color:white;line-height:1.4;}
.rp-head:hover{opacity:.93;}
.rp-arrow{font-size:11px;color:rgba(255,255,255,.7);transition:transform .2s;flex-shrink:0;margin-left:8px;}
.rp-panel.open .rp-arrow{transform:rotate(90deg);}
.rp-body{padding:12px 14px 16px;background:#f8fafc;}
.rp-cat{margin-bottom:14px;border-radius:10px;overflow:hidden;border:1.5px solid #e2e8f0;background:white;}
.rp-cat-title{font-size:11.5px;font-weight:800;color:white;background:var(--p);padding:7px 12px;letter-spacing:.03em;display:flex;align-items:center;gap:6px;}
.rp-items{padding:8px 10px;}
.rp-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:7px;border:1.5px solid #f1f5f9;background:#f8fafc;margin-bottom:5px;font-size:12px;color:#334155;font-style:italic;line-height:1.4;}
.rp-item:last-child{margin-bottom:0;}
.rp-copy{flex-shrink:0;background:var(--d);color:white;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.rp-copy:hover{background:var(--p);color:var(--d);}
.rp-copy.ok{background:#22c55e;}
</style>
</head>

function toggleCat(idx) { openCat = (openCat===idx) ? null : idx; render(); }

function setMedien(val) { S.medien = val; if(!val) S.medienLink = ""; render(); }

function toggleMedienAspekt(idx) {
  var opts = L().medienOpts;
  var val = opts[idx];
  if(!S.medienAspekte) S.medienAspekte = [];
  var i = S.medienAspekte.indexOf(val);
  if(i>=0) S.medienAspekte.splice(i,1); else S.medienAspekte.push(val);
  render();
}

function pickSit(catIdx, sitIdx) {
  var niv = S.niv || "A1";
  var themes = (L().themes[niv]) || (L().themes["A1"]) || [];
  var cat = themes[catIdx];
  var val = cat.sits[sitIdx];
  S.th = cat.cat; S.thOwn = "";
  var i = S.sits.indexOf(val);
  if(i>=0) S.sits.splice(i,1); else S.sits.push(val);
  render();
}

function useOwnTheme() {
  var val = document.getElementById("thOwn").value;
  S.thOwn = val;
  if(val.trim()) { S.th = val.trim(); S.sits = []; openCat = null; }
}

function togArr(key, idx) {
  var sd=L().steps[cur-1];
  var arr2=sd[key];
  var val=arr2[idx];
  var arr=S[key];
  var i=arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  render();
}

function pickNiv(code) { S.niv=(S.niv===code)?null:code; openCat=null; render(); }

function toggleAcc(idx) { openAcc = (openAcc===idx) ? null : idx; render(); }

function getAccItem(idx) {
  var sd = L().steps[cur-1];
  return sd.accordion[idx];
}

function pickAccSingle(accIdx, optIdx) {
  var item = getAccItem(accIdx);
  S.accVals[item.key] = [item.opts[optIdx]];
  render();
}

function toggleAccMulti(accIdx, optIdx) {
  var item = getAccItem(accIdx);
  if(!S.accVals[item.key]) S.accVals[item.key] = item.defaults.slice();
  var arr = S.accVals[item.key];
  var val = item.opts[optIdx];
  var i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  render();
}

function setAccCustomSingle(accIdx, val) {
  var item = getAccItem(accIdx);
  if(!S.accCustom) S.accCustom = {};
  S.accCustom[item.key] = val;
  if(val.trim()) {
    S.accVals[item.key] = [val.trim()];
  }
  render();
}

function setAccCustom(accIdx, val) {
  var item = getAccItem(accIdx);
  if(!S.accCustom) S.accCustom = {};
  S.accCustom[item.key] = val;
  if(val.trim()) {
    if(!S.accVals[item.key]) S.accVals[item.key] = item.defaults.slice();
    var stdOpts = item.opts;
    S.accVals[item.key] = S.accVals[item.key].filter(function(v){ return stdOpts.indexOf(v) >= 0; });
    S.accVals[item.key].push(val.trim());
  }
}

function saveStep() {
  if(cur===0) return;
  var si=cur-1;
  if(si===0) { var zsc=document.getElementById("zsCustom"); if(zsc&&zsc.value.trim()) S.zs=zsc.value.trim(); var esc2=document.getElementById("esCustom"); if(esc2&&esc2.value.trim()) S.es=esc2.value.trim(); }
  else if(si===1) { S.au=gv("au"); S.ws=gv("ws"); var to=document.getElementById("thOwn"); if(to) S.thOwn=to.value; var ml=document.getElementById("medienLink"); if(ml) S.medienLink=ml.value; var mab=document.getElementById("medienAbschnitt"); if(mab) S.medienAbschnitt=mab.value; var mk=document.getElementById("medienKommentar"); if(mk) S.medienKommentar=mk.value; }
}

function nav(dir) {
  if(dir===1&&cur===T-1) {
    S={lang:S.lang,nb:["Quantitatives & qualitatives Feedback","Persönlicher Lernbericht (als Textdatei)","Zweisprachige Vokabelliste erstellen"],ha:["Andere Möglichkeiten zur Weiterarbeit vorschlagen"],sits:[],zs:"Deutsch",es:"Englisch",accVals:{},accCustom:{}};
    openCat=null; openAcc=null;
    cur=0; render(); return;
  }
  saveStep();
  if(dir===1) {
    var reqs=cur>0&&cur<T-1?(L().steps[cur-1].r||[]):[];
    for(var i=0;i<reqs.length;i++) {
      var k=reqs[i];
      var ok=Array.isArray(S[k])?(S[k].length>0):!!S[k];
      if(!ok) { document.getElementById("em").textContent=lb().req; return; }
    }
    // Step 2: require either a theme category OR own theme text
    if(cur===2 && !S.th && !(S.thOwn&&S.thOwn.trim())) {
      document.getElementById("em").textContent=lb().req; return;
    }
  }
  cur=Math.max(0,Math.min(T-1,cur+dir));
  render();
}

function fmtPrompt(p) {
  var lines=p.split("\n");
  var out="";
  for(var i=0;i<lines.length;i++) {
    var line=lines[i];
    if(line==="---") out+="<hr class=\"rdiv\">";
    else if(/^[A-Z\u05D0-\u05EA][^:].{0,35}:$/.test(line.trim())) out+="<span class=\"rl2\">"+esc(line)+"</span>";
    else out+="<span class=\"rv\">"+esc(line)+"</span>";
  }
  return out;
}

    if(S.ha.length||S.haCustom){
      var haStep = null;
      for(var si3=0;si3<L().steps.length;si3++){if(L().steps[si3].t&&L().steps[si3].ha){haStep=L().steps[si3];break;}}
      L2.push("---");L2.push("NÄCHSTE SCHRITTE:");
      L2.push("Nach der Nachbereitung bitte folgendes anbieten:");
      for(var hi=0;hi<S.ha.length;hi++){
        var haName=S.ha[hi];
        var haDesc="";
        if(haStep){
          var haIdx=haStep.ha.indexOf(haName);
          if(haIdx>=0&&haStep.ha_desc&&haStep.ha_desc[haIdx]) haDesc=haStep.ha_desc[haIdx];
        }
        var haLine="- "+haName;
        if(haDesc) haLine+=": "+haDesc;
        L2.push(haLine);
      }
      if(S.haCustom) L2.push("- "+S.haCustom);}
    L2.push("---");
    L2.push("Wichtig: Ich kann jederzeit um Anpassungen bitten. Reagiere flexibel.");
    L2.push("Beginne jetzt mit deiner Vorstellung.");
  }
  return L2.join("\n");
}

function copyReprompt(e, ri, rj) {
  e.stopPropagation();
  var text = REPROMPTS[ri].items[rj];
  var btn = e.target;
  navigator.clipboard.writeText(text).then(function() {
    btn.textContent = "✓";
    btn.classList.add("ok");
    setTimeout(function(){ btn.textContent = "Kopieren"; btn.classList.remove("ok"); }, 2000);
  });
}

function doCopy() {
  navigator.clipboard.writeText(S.prompt||"").then(function() {
    var b=document.getElementById("cpb");
    document.getElementById("cpi").textContent="\u2713";
    document.getElementById("cpl").textContent=lb().cpd;
    b.classList.add("ok");
    setTimeout(function(){b.classList.remove("ok");document.getElementById("cpi").textContent="\uD83D\uDCCB";document.getElementById("cpl").textContent=lb().cpy;},2500);
  });
}

render();
</script>
